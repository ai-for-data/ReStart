[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodpfn"
version = "0.1.0"
license = {file = "LICENSE"}
dependencies = ["numpy"]
description = "Explicit initial-noise context adaptation for upstream frozen policies"
requires-python = ">=3.10"

[project.optional-dependencies]
pfn = ["tabicl==2.2.0"]

[tool.setuptools.packages.find]
include = ["embodpfn*"]
